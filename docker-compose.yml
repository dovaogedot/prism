name: prism

services:
  postgres:
    # Pinned to the patch, because a floating tag means the laptop and the
    # server can run different code and only the server finds out.
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prism}
      POSTGRES_DB: prism
    volumes:
      # One mount above the data directory, not on it. Postgres 18 keeps its
      # data in a major-version subdirectory — /var/lib/postgresql/18/docker —
      # so a volume mounted at .../data is a volume the database never writes
      # to, and 18.6 refuses to start rather than let that pass unnoticed.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -d matters: the socket accepts connections before initdb has finished
      # creating the database, so checking the socket alone reports ready early.
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.28
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      # Password-reset emails land here — this is the inbox a reviewer opens.
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: applies migrations, then seeds the catalog. The api waits for
  # this to exit 0, so it never serves a request against a half-built schema.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["sh", "-c", "node src/db/migrate.ts && node src/db/seed.ts"]
    environment:
      DATABASE_URL: postgres://prism:${POSTGRES_PASSWORD:-prism}@postgres:5432/prism
      MEDIA_DIR: /srv/media
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Per address per minute, on /auth/* — and /auth/refresh is one of them,
      # which every page load calls to restore the session. Ten is the right
      # number for one person signing in and the wrong one for a browser
      # opening pages as fast as it can, so the local stack raises it and a
      # deployment sets its own.
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-60}
    volumes:
      - media:/srv/media
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 8080
      DATABASE_URL: postgres://prism:${POSTGRES_PASSWORD:-prism}@postgres:5432/prism
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Per address per minute, on /auth/* — and /auth/refresh is one of them,
      # which every page load calls to restore the session. Ten is the right
      # number for one person signing in and the wrong one for a browser
      # opening pages as fast as it can, so the local stack raises it and a
      # deployment sets its own.
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-60}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-Prism <noreply@prism.test>}
      MEDIA_DIR: /srv/media
      # Supplying a key is what turns each of these on; there is no mode to
      # set alongside it and therefore no way for the two to disagree.
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      - media:/srv/media
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  media:
