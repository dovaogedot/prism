name: prism

services:
  postgres:
    # Pinned to the patch, because a floating tag means the laptop and the
    # server can run different code and only the server finds out.
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prism}
      POSTGRES_DB: prism
    volumes:
      # One mount above the data directory, not on it. Postgres 18 keeps its
      # data in a major-version subdirectory — /var/lib/postgresql/18/docker —
      # so a volume mounted at .../data is a volume the database never writes
      # to, and 18.6 refuses to start rather than let that pass unnoticed.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -d matters: the socket accepts connections before initdb has finished
      # creating the database, so checking the socket alone reports ready early.
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.28
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      # Password-reset emails land here — this is the inbox a reviewer opens.
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: applies migrations. The api waits for this to exit 0, so it
  # never serves a request against a half-built schema.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "src/db/migrate.ts"]
    environment:
      DATABASE_URL: postgres://prism:${POSTGRES_PASSWORD:-prism}@postgres:5432/prism
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 8080
      DATABASE_URL: postgres://prism:${POSTGRES_PASSWORD:-prism}@postgres:5432/prism
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Per address per minute on /auth/*, which includes the refresh every
      # page load makes to restore the session.
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-60}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-Prism <noreply@prism.test>}
      MEDIA_DIR: /srv/media
      # Supplying a key is what turns each of these on; there is no mode to
      # set alongside it and therefore no way for the two to disagree.
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      - media:/srv/media
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Every test suite, for a host with Docker and no Node: `./start.sh test`.
  # The profile keeps it out of `up`. Testcontainers starts the suites' own
  # Postgres through the host's Docker socket and, from inside a container,
  # reaches it at the gateway of the default bridge network, so this service
  # joins that network rather than the project's.
  test:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.test
    network_mode: bridge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Placeholder products. `./start.sh` runs it once the shop is up, and
  # `./start.sh seed` runs it alone. The profile keeps it out of `up`, so the
  # shop never depends on it and the production stack never sees it. A run
  # that finds no unpacked data in apps/api/seed unpacks data.zip there
  # first, and every run plants what is there into an empty catalog. Unpacked
  # files get the owner of the folder they land in, not root.
  seed:
    profiles: [seed]
    build:
      context: .
      dockerfile: Dockerfile.test
    working_dir: /app/apps/api
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f seed/catalog.json ]; then
          node seed/archive.ts unpack
          chown -R "$$(stat -c %u:%g seed)" seed/catalog.json seed/media
        fi
        node seed/seed.ts
    environment:
      DATABASE_URL: postgres://prism:${POSTGRES_PASSWORD:-prism}@postgres:5432/prism
      MEDIA_DIR: /srv/media
    volumes:
      - ./apps/api/seed:/app/apps/api/seed
      - media:/srv/media
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  media:
