name: prism

services:
  postgres:
    # Pinned to the patch, because a floating tag means the laptop and the
    # server can run different code and only the server finds out.
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prism}
      POSTGRES_DB: prism
    volumes:
      # One mount above the data directory, not on it. Postgres 18 keeps its
      # data in a major-version subdirectory, /var/lib/postgresql/18/docker,
      # so a volume mounted at .../data is a volume the database never writes
      # to, and 18.6 refuses to start rather than let that pass unnoticed.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -d matters: the socket accepts connections before initdb has finished
      # creating the database, so checking the socket alone reports ready early.
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.28
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      # The inbox's page and API ask for this login; sending mail to it needs none.
      MP_UI_AUTH: prism:${MAILPIT_PASSWORD:-prism}
    ports:
      # Order and password-reset emails land here: this is the inbox a reviewer opens.
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The message queue between the order and payment services. The management
  # UI on 15672 shows the exchanges, the queues and the dead-letter queue.
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    # RabbitMQ names its data directory after the host, so a fixed name keeps
    # the queues across a container being recreated.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: prism
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-prism}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot: applies migrations, and seals what an older schema kept in
  # plain text, which is why it needs the key. The api waits for this to exit
  # 0, so it never serves a request against a half-built schema.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "src/db/migrate.ts"]
    environment:
      DATABASE_URL: postgres://prism:${POSTGRES_PASSWORD:-prism}@postgres:5432/prism
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 8080
      DATABASE_URL: postgres://prism:${POSTGRES_PASSWORD:-prism}@postgres:5432/prism
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Multiplies every rate limit's capacity and refill rate. 1 everywhere
      # but the browser suite's and the load test's stacks.
      RATE_LIMIT_SCALE: ${RATE_LIMIT_SCALE:-1}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-Prism <noreply@prism.test>}
      # The inbox the contact form writes to; Mailpit catches it locally.
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@prism.test}
      MEDIA_DIR: /srv/media
      # Supplying a key is what turns each of these on; there is no mode to
      # set alongside it and therefore no way for the two to disagree.
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env}
      RABBITMQ_URL: amqp://prism:${RABBITMQ_PASSWORD:-prism}@rabbitmq:5672
      # Both keys turn payments on. Without them the cart works and checkout
      # says payments are not set up.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      # Set on a server with a webhook endpoint registered in the Stripe
      # dashboard. Empty, the API reads the file the stripe service writes.
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_WEBHOOK_SECRET_FILE: /run/stripe/webhook-secret
      STRIPE_TIMEOUT_MS: ${STRIPE_TIMEOUT_MS:-10000}
      ADDRESS_LOOKUP_URL: ${ADDRESS_LOOKUP_URL-https://nominatim.openstreetmap.org}
      PAYMENT_WINDOW_SECONDS: ${PAYMENT_WINDOW_SECONDS:-1800}
      # The shop's first admin, made at start when no account holds the role.
      # The three go together; empty, the shop starts without an admin.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      # stripe takes payments once both keys are set; simulated settles every
      # payment on the server, and the API allows it only on localhost.
      PAYMENTS_MODE: ${PAYMENTS_MODE:-stripe}
    volumes:
      - media:/srv/media
      - stripe-secret:/run/stripe:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
    environment:
      # self-signed: HTTPS with a certificate the container makes for
      # localhost. off: plain HTTP behind a proxy that holds a real one.
      WEB_TLS: ${WEB_TLS:-self-signed}
    volumes:
      # The self-signed certificate and its key, kept across restarts so the
      # browser's exception for it keeps working.
      - web-tls:/tls
      # The product pictures the API writes, served from here without Node.
      # The volume is the API's: nocopy keeps the image's own /media folders,
      # and their owner, out of it.
      - type: volume
        source: media
        target: /media
        read_only: true
        volume:
          nocopy: true
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Forwards Stripe's test-mode webhooks to the API, so a laptop needs no
  # public address. Each start gets a signing secret from Stripe and writes it
  # where the API reads it on every webhook. COMPOSE_PROFILES=stripe in .env
  # brings it up with the rest; without a secret key it exits at once.
  stripe:
    profiles: [stripe]
    image: stripe/stripe-cli:v1.53.0
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -z "$$STRIPE_SECRET_KEY" ]; then
          echo "STRIPE_SECRET_KEY is empty in .env, so there are no webhooks to forward."
          exit 0
        fi
        stripe listen --api-key "$$STRIPE_SECRET_KEY" --print-secret > /run/stripe/webhook-secret
        exec stripe listen --api-key "$$STRIPE_SECRET_KEY" \
          --forward-to http://api:8080/api/v1/payments/webhook \
          --events payment_intent.succeeded,payment_intent.payment_failed,payment_intent.canceled,refund.updated
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    volumes:
      - stripe-secret:/run/stripe
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure

  # Every test suite, for a host with Docker and no Node: `./start.sh test`.
  # The profile keeps it out of `up`. Testcontainers starts the suites' own
  # Postgres through the host's Docker socket and, from inside a container,
  # reaches it at the gateway of the default bridge network, so this service
  # joins that network rather than the project's.
  test:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.test
    network_mode: bridge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The build context leaves the seed's archive out for its size, and the
      # web's SEO test reads the seeded catalog from it.
      - ./apps/api/seed/data.zip:/app/apps/api/seed/data.zip:ro

  # Placeholder products. `./start.sh` runs it once the shop is up, and
  # `./start.sh seed` runs it alone. The profile keeps it out of `up`, so the
  # shop never depends on it and the production stack never sees it. A run
  # that finds no unpacked data in apps/api/seed unpacks data.zip there
  # first, and every run plants what is there into an empty catalog. Unpacked
  # files get the owner of the folder they land in, not root, and the media
  # volume ends up owned by the API's user.
  seed:
    profiles: [seed]
    build:
      context: .
      dockerfile: Dockerfile.test
    working_dir: /app/apps/api
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f seed/catalog.json ]; then
          node seed/archive.ts unpack
          chown -R "$$(stat -c %u:%g seed)" seed/catalog.json seed/media
        fi
        node seed/seed.ts
        # The API runs as node and writes uploads and their smaller copies
        # here too, so it owns what the seed wrote as root.
        chown -R node:node /srv/media
    environment:
      DATABASE_URL: postgres://prism:${POSTGRES_PASSWORD:-prism}@postgres:5432/prism
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env}
      MEDIA_DIR: /srv/media
    volumes:
      - ./apps/api/seed:/app/apps/api/seed
      - media:/srv/media
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  media:
  rabbitmq-data:
  web-tls:
  # The webhook signing secret the stripe service writes and the api reads.
  stripe-secret:
