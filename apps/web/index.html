<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hue &amp; Cry — a shop that sells colours</title>
    <meta
      name="description"
      content="A shop that sells colours. Not paint. Colours."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23facc15'/%3E%3Cpath d='M16 2a14 14 0 0 0 0 28z' fill='%232563eb'/%3E%3C/svg%3E" />
    <script>
      // Applied before first paint: without this the page flashes light before
      // the React tree mounts and reads the stored preference.
      (() => {
        const stored = localStorage.getItem("hue-theme");
        const dark =
          stored === "dark" ||
          (stored === null &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
