# Tests the shop, builds its two images, and restarts it on the VPS with them.
name: Deploy # The name shown in the Actions tab.

on: # The events that start this workflow.
  push: # A push starts a deploy...
    branches: [main] # ...but only a push to main.
  workflow_dispatch: # Allows a manual run from the Actions tab.
    inputs: # The choices a manual run offers.
      rebuild_database: # The way on from a refused migration, like `./start.sh reset` on a laptop.
        description: Rebuild the database from the migrations, deleting every account, product, review and order # The label beside the box.
        type: boolean # A checkbox.
        default: false # Unticked, so a manual run keeps the data.

permissions: # The rights of each job's GITHUB_TOKEN, unless the job sets its own.
  contents: read # Enough to check out the code; the token can change nothing.

concurrency: # Keeps deploys from overlapping.
  group: deploy # Every run joins the same group, so they run one at a time.
  cancel-in-progress: false # A running deploy finishes; the next one waits.

env: # Variables every job can read.
  # Each image is named after the repository and tagged with the commit, so
  # what the server runs traces back to one commit. A moving tag such as
  # `latest` could name a different build by the time the server pulls it.
  API_IMAGE: ghcr.io/${{ github.repository }}-api:${{ github.sha }} # The API; it also runs the migrations.
  WEB_IMAGE: ghcr.io/${{ github.repository }}-web:${{ github.sha }} # The storefront, served by Caddy.

jobs: # The work this workflow does.
  verify: # Typechecks and runs every test suite.
    name: Typecheck and test # The name shown in the run's graph.
    runs-on: ubuntu-latest # A fresh GitHub-hosted Linux machine with Docker, which the tests use.
    steps: # The steps run in order; a failing step stops the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; a commit SHA cannot be moved like a tag.
        with: # Settings for the checkout.
          persist-credentials: false # Leaves no GitHub token in .git for later steps.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0; pinned the same way.
        with: # Settings for Node.
          node-version-file: .nvmrc # Uses the same Node version as local work.
          cache: npm # Caches npm downloads between runs.
      - run: npm ci # Installs exactly what package-lock.json lists.
      - run: npm run build # Builds the shared package; both apps import its built output, so the typecheck needs it.
      - run: npm run typecheck # Stops the deploy on a type error.
      - run: npm test # Stops the deploy on a failing test; the integration and security suites start their own Postgres with Testcontainers.

  # The VPS is too small to build the images, so this job builds them and the
  # server only pulls. It runs beside the tests rather than after them: an
  # image of a failing commit is never deployed, and waiting for the tests
  # would add the build time to every deploy.
  build: # Builds both images and pushes them to the registry.
    name: Build and push images # The name shown in the run's graph.
    runs-on: ubuntu-latest # A fresh GitHub-hosted Linux machine with Docker.
    environment: production # Runs only on main, the one branch this environment allows, and reads its secrets.
    permissions: # This job's rights, in place of the ones above.
      contents: read # Enough to check out the code.
      packages: write # Pushes the images to this repository's registry.
    steps: # The steps run in order; a failing step stops the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; pinned the same way.
        with: # Settings for the checkout.
          persist-credentials: false # Leaves no GitHub token in .git for later steps.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1; pinned the same way.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0; pinned the same way.
        with: # Settings for the sign-in.
          registry: ghcr.io # The GitHub container registry.
          username: ${{ github.actor }} # The account that started the run.
          password: ${{ secrets.GITHUB_TOKEN }} # This job's token; it expires with the job.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0; pinned the same way.
        with: # Settings for the API image.
          context: . # The checkout, less what .dockerignore leaves out.
          file: apps/api/Dockerfile # The recipe for the API image.
          push: true # Pushes the image once it is built.
          tags: ${{ env.API_IMAGE }} # The name and commit tag from the top of this file.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0; pinned the same way.
        with: # Settings for the storefront image.
          context: . # The checkout, less what .dockerignore leaves out.
          file: apps/web/Dockerfile # The recipe for the storefront image.
          push: true # Pushes the image once it is built.
          tags: ${{ env.WEB_IMAGE }} # The name and commit tag from the top of this file.
          # Vite reads the site key at build time, so the key is part of the
          # image. Empty, the build uses Google's always-pass test key.
          build-args: | # Build-time values, one per line.
            VITE_RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}

  # The browser suite, against the very images build pushed: they start with
  # the suite's overlay under a project of their own, take the seed's
  # catalog the way the server does, and Playwright checks every page in both
  # themes. A deploy waits for it.
  e2e: # Runs the browser suite against this commit's images.
    name: Browser suite # The name shown in the run's graph.
    needs: [build] # The images exist once build has pushed them.
    runs-on: ubuntu-latest # A fresh GitHub-hosted Linux machine with Docker.
    permissions: # This job's rights, in place of the ones above.
      contents: read # Enough to check out the code.
      packages: read # Pulls this commit's images.
    env: # Variables every step can read.
      E2E_COMPOSE: docker compose -p prism-e2e -f docker-compose.yml -f docker-compose.e2e.yml # The suite's stack, never the shop's.
    steps: # The steps run in order; a failing step stops the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; pinned the same way.
        with: # Settings for the checkout.
          persist-credentials: false # Leaves no GitHub token in .git for later steps.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0; pinned the same way.
        with: # Settings for the sign-in.
          registry: ghcr.io # The GitHub container registry.
          username: ${{ github.actor }} # The account that started the run.
          password: ${{ secrets.GITHUB_TOKEN }} # This job's token; it expires with the job.
      - name: Start the stack from this commit's images # Named as the project would name its own builds, so nothing is built.
        run: | # A bash script.
          printf 'JWT_SECRET=%s\nDATA_ENCRYPTION_KEY=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env # Throwaway keys for a stack that lives as long as this job.
          docker pull "$API_IMAGE" # The API, which also runs the migrations and the seed.
          docker pull "$WEB_IMAGE" # The storefront.
          docker tag "$API_IMAGE" prism-e2e-api
          docker tag "$API_IMAGE" prism-e2e-migrate
          docker tag "$WEB_IMAGE" prism-e2e-web
          $E2E_COMPOSE up --no-build --detach # Returns once the migrations ran and the API started.
      - name: Seed the shop # The seed the API image carries, with the data unzipped beside it, as on the server.
        run: | # A bash script.
          mkdir seed
          unzip -q apps/api/seed/data.zip -d seed
          $E2E_COMPOSE run --rm --no-deps --pull never -T \
            -v "$PWD/seed/catalog.json:/app/apps/api/seed/catalog.json:ro" \
            -v "$PWD/seed/media:/app/apps/api/seed/media:ro" \
            api node seed/seed.ts < /dev/null
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0; pinned the same way.
        with: # Settings for Node.
          node-version-file: .nvmrc # Uses the same Node version as local work.
          cache: npm # Caches npm downloads between runs.
      - run: npm ci --workspace @prism/e2e # Installs only the suite's packages.
      - run: npx playwright install --with-deps chromium # The browser this Playwright version drives, with its system libraries.
        working-directory: apps/e2e # The suite's workspace.
      - run: npx playwright test # Every page in both themes, the keyboard journeys and the admin's gate.
        working-directory: apps/e2e # The suite's workspace.
        env: # The address the suite opens.
          E2E_BASE_URL: https://localhost:3200 # The e2e overlay's port; the certificate is self-signed, which the suite accepts.

  deploy: # Sends the settings to the VPS and restarts the shop on the new images.
    name: Pull and restart on the server # The name shown in the run's graph.
    needs: [verify, build, e2e] # Starts only when the tests pass, both images are in the registry, and the browser suite passed on them.
    runs-on: ubuntu-latest # A fresh GitHub-hosted Linux machine with ssh and scp.
    environment: production # Runs only on main, the one branch this environment allows, and reads its secrets.
    permissions: # This job's rights, in place of the ones above.
      contents: read # Enough to check out the code.
      packages: read # Lets the server pull the images with this job's token.
    env: # Variables every step can read.
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }} # The folder with the compose files and .env: absolute, or relative to the user's home without a leading ~.
      WEB_PORT: ${{ vars.WEB_PORT || '8090' }} # The loopback port the reverse proxy forwards the site to.
    steps: # The steps run in order; a failing step stops the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; pinned the same way.
        with: # Settings for the checkout.
          persist-credentials: false # Leaves no GitHub token in .git for later steps.

      - name: Configure SSH # Prepares the key, the host key and a host alias.
        env: # Secrets reach the shell as variables, never pasted into the script.
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }} # The server's IP address or name.
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }} # The SSH port; may be unset.
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }} # The user that runs the stack; it needs the docker group.
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }} # The private key that user accepts.
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }} # The server's pinned host key line.
        run: | # A bash script.
          install -d -m 700 ~/.ssh # ssh refuses a key directory that others can read.
          install -m 600 /dev/null ~/.ssh/deploy_key # Creates the key file private before anything is written to it.
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key # Writes the key; the trailing newline is required.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts # The only host key this job trusts.
          # "host" becomes a name that ssh and scp both resolve to the server.
          cat > ~/.ssh/config <<EOF
          Host host
            HostName $DEPLOY_HOST
            Port ${DEPLOY_PORT:-22}
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 2m
          EOF
          # The lines above: the server's address, port (22 when unset) and
          # user; the key to use, and no other key; refuse any host key not in
          # known_hosts; fail rather than prompt; and share one connection
          # among the ssh and scp calls below, kept open for two minutes.

      - name: Upload the settings # Sends the compose files, and writes the server's .env from this repository's settings.
        env: # Secrets reach the shell as variables, never pasted into the script. Each name is also its name in .env.
          COMPOSE_FILE: docker-compose.yml:docker-compose.prod.yml # Makes every `docker compose` in that folder, by hand too, apply the production overlay.
          MAILPIT_PORT: ${{ vars.MAILPIT_PORT || '8026' }} # The loopback port of the reset-mail inbox.
          RABBITMQ_UI_PORT: ${{ vars.RABBITMQ_UI_PORT || '15672' }} # The loopback port of the RabbitMQ management UI.
          PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }} # The address people type; reset links and OAuth redirects are built from it.
          MAIL_FROM: ${{ vars.MAIL_FROM || 'Prism <noreply@localhost>' }} # The sender of reset mail.
          LOG_LEVEL: info # The lowest level the API logs.
          JWT_SECRET: ${{ secrets.JWT_SECRET }} # Signs the sessions.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }} # Read only when the database is first created.
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }} # Encrypts at rest every column that identifies a person, and keys the indexes that find them; losing it loses that data.
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }} # Read only when RabbitMQ first initializes its volume.
          MAILPIT_PASSWORD: ${{ secrets.MAILPIT_PASSWORD }} # The Mailpit inbox's login, as prism / this.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }} # Set with the publishable key, the shop takes payments.
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }} # The browser half of the pair.
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }} # Verifies the webhook endpoint registered in the Stripe dashboard.
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }} # Set, the API checks each CAPTCHA with Google.
          OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }} # Set with its secret, Google sign-in is real.
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }} # The other half of Google's pair.
          OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }} # Set with its secret, GitHub sign-in is real.
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }} # The other half of GitHub's pair.
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL || 'support@localhost' }} # The inbox the contact form writes to.
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }} # The first admin's sign-in, made at start when no account holds the role.
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }} # The first admin's password, at least 12 characters.
          ADMIN_TOTP_SECRET: ${{ secrets.ADMIN_TOTP_SECRET }} # The first admin's 2FA key, base32 of 32 characters or more, as an authenticator app takes it.
        run: | # A bash script.
          # Stops before the server is touched when a value with no safe
          # default is missing. An empty POSTGRES_PASSWORD would fall back to
          # the public local one, a wrong PUBLIC_WEB_URL breaks every reset
          # link and OAuth redirect, and without the three admin values the
          # shop starts with nobody who can run it.
          for name in DEPLOY_PATH PUBLIC_WEB_URL JWT_SECRET POSTGRES_PASSWORD DATA_ENCRYPTION_KEY RABBITMQ_PASSWORD MAILPIT_PASSWORD \
            ADMIN_EMAIL ADMIN_PASSWORD ADMIN_TOTP_SECRET; do
            if [ -z "${!name}" ]; then
              echo "$name is not set." >&2
              exit 1
            fi
          done

          # A server has no Stripe CLI to hand the API a signing secret, so
          # payments without the dashboard endpoint's secret would refuse
          # every webhook.
          if [ -n "$STRIPE_SECRET_KEY" ] && [ -z "$STRIPE_WEBHOOK_SECRET" ]; then
            echo "STRIPE_SECRET_KEY is set but STRIPE_WEBHOOK_SECRET is not." >&2
            exit 1
          fi

          # Builds the .env text, one NAME='value' line per setting. Compose
          # reads a single-quoted value literally, so a `$`, `#` or space in a
          # secret stays as it is. A single quote or a line break cannot be
          # written that way, so either one stops the deploy.
          settings=''
          for name in COMPOSE_FILE API_IMAGE WEB_IMAGE WEB_PORT MAILPIT_PORT RABBITMQ_UI_PORT PUBLIC_WEB_URL MAIL_FROM \
            LOG_LEVEL JWT_SECRET POSTGRES_PASSWORD RECAPTCHA_SECRET_KEY \
            OAUTH_GOOGLE_CLIENT_ID OAUTH_GOOGLE_CLIENT_SECRET OAUTH_GITHUB_CLIENT_ID OAUTH_GITHUB_CLIENT_SECRET \
            DATA_ENCRYPTION_KEY RABBITMQ_PASSWORD MAILPIT_PASSWORD STRIPE_SECRET_KEY STRIPE_PUBLISHABLE_KEY STRIPE_WEBHOOK_SECRET \
            SUPPORT_EMAIL ADMIN_EMAIL ADMIN_PASSWORD ADMIN_TOTP_SECRET; do
            value=${!name} # The value of the variable with that name.
            if [[ $value == *"'"* || $value == *$'\n'* ]]; then
              echo "$name holds a single quote or a line break, which a .env line cannot carry." >&2
              exit 1
            fi
            settings+="$name='$value'"$'\n'
          done

          ssh host "mkdir -p '$DEPLOY_PATH'" # Creates the folder on the first deploy.
          scp docker-compose.yml docker-compose.prod.yml "host:$DEPLOY_PATH/" # The compose files of this commit.
          printf '%s' "$settings" | ssh host "umask 077 && cat > '$DEPLOY_PATH/.env.new' && mv -f '$DEPLOY_PATH/.env.new' '$DEPLOY_PATH/.env'"
          # The last line: the secrets travel on stdin, so they appear in no
          # command line and in no file on this machine. umask 077 creates
          # the file readable by its owner alone, and mv swaps it in whole, so
          # no one ever reads an open or half-written .env.

      - name: Sign the server in to the registry # Lets the server pull the private images.
        id: login # Named, so the sign-out below can tell whether this ran.
        env: # The only secret this step needs.
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This job's token: it can read packages and expires with the job.
        run: | # A bash script.
          # The token travels on stdin; in the command it would show in the
          # server's process list.
          printf '%s\n' "$REGISTRY_TOKEN" | ssh host "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

      - name: Pull the images # Downloads both images while the running shop keeps serving.
        run: ssh host "cd '$DEPLOY_PATH' && docker compose pull --quiet" # COMPOSE_FILE in .env adds the production overlay.

      - name: Delete the database # Only a manual run with the box ticked gets here.
        if: github.event_name == 'workflow_dispatch' && inputs.rebuild_database # The box from the top of this file.
        run: ssh host "cd '$DEPLOY_PATH' && docker compose down --volumes" # Removes the stack and its volumes, so the next step starts from an empty database.

      - name: Migrate and start # Applies the migrations, then replaces the running containers.
        run: | # A bash script.
          # Runs the script below on the server, passing the folder as $1.
          # The quoted 'EOF' stops this machine from expanding anything in it.
          ssh host sh -s -- "'$DEPLOY_PATH'" <<'EOF'
          set -eu
          cd "$1"
          docker compose run --rm -T migrate < /dev/null
          docker compose up -d --remove-orphans
          EOF
          # The server script, line by line:
          # - set -eu: stop at the first failing command or unset variable,
          #   so a refused migration never reaches `up`.
          # - cd: work inside the folder, where .env names the compose files.
          # - run migrate: the migration runs alone first and attached, so its
          #   output lands in this log, and a failure stops the deploy while
          #   the running version keeps serving. -T gives it no terminal.
          #   `run` keeps stdin open, and stdin is this script: without
          #   < /dev/null it reads the lines below as its own input, and the
          #   shell reaches the end with `up` never run.
          # - up: replaces every container whose image or settings changed.
          #   It runs the migration again as the API's dependency, which
          #   finds nothing left to do. --remove-orphans stops containers of
          #   services that the compose files no longer have.

      - name: Sign the server out of the registry # Deletes the token from the server's disk.
        if: always() && steps.login.outcome == 'success' # Runs after a failure too, once the sign-in has happened.
        run: ssh host docker logout ghcr.io # The token dies with the job anyway; this removes the copy sooner.

      - name: Wait for the storefront to answer # Fails the deploy when the new version does not come up.
        run: | # A bash script.
          # Runs the script below on the server, passing the folder and the
          # storefront's port as $1 and $2.
          ssh host sh -s -- "'$DEPLOY_PATH'" "$WEB_PORT" <<'EOF'
          set -eu
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://127.0.0.1:$2/api/v1/health"; then
              echo "healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo 'the stack did not become healthy' >&2
          cd "$1"
          docker compose ps
          docker compose logs --tail 60 api web
          exit 1
          EOF
          # The server script asks the health route through the storefront
          # once a second for up to a minute, which checks Caddy and the API
          # together. When no answer comes, it prints the state of the
          # containers and their last log lines here, then fails.

      - name: Drop images no container uses # Keeps a small disk from filling with an image pair per commit.
        run: ssh host 'docker image prune --all --force --filter "until=168h" > /dev/null' # Removes each unused image built more than a week ago.
